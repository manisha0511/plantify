<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F6F3" />
      <stop offset="100%" stop-color="#E5ECE7" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E785D" />
      <stop offset="100%" stop-color="#16302B" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#87A987" />
      <stop offset="100%" stop-color="#2D5A47" />
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97A53" />
      <stop offset="100%" stop-color="#B85832" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24" />

  <!-- Botanical Plant Vector Illustration -->
  <g transform="translate(200, 220)">
    <!-- Soil rim -->
    <ellipse cx="0" cy="0" rx="60" ry="14" fill="#3D2B1F" opacity="0.6" />

    <!-- Stem 1 (Center) -->
    <path d="M 0,0 Q -5,-70 0,-130" stroke="#2D5A47" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Leaf Center Top -->
    <path d="M 0,-130 C -25,-165 0,-195 0,-195 C 0,-195 25,-165 0,-130 Z" fill="url(#leafGrad1)" />

    <!-- Leaf Left 1 -->
    <path d="M -2,-80 C -45,-95 -65,-75 -85,-65 C -75,-45 -45,-55 -2,-70 Z" fill="url(#leafGrad2)" />

    <!-- Leaf Right 1 -->
    <path d="M 2,-75 C 45,-90 65,-70 85,-60 C 75,-40 45,-50 2,-65 Z" fill="url(#leafGrad1)" />

    <!-- Leaf Left 2 -->
    <path d="M -3,-40 C -40,-50 -60,-35 -75,-25 C -65,-10 -40,-20 -3,-30 Z" fill="url(#leafGrad1)" />

    <!-- Leaf Right 2 -->
    <path d="M 3,-35 C 40,-45 60,-30 75,-20 C 65,-5 40,-15 3,-25 Z" fill="url(#leafGrad2)" />

    <!-- Plant Pot -->
    <path d="M -55,4 L -42,85 Q 0,95 42,85 L 55,4 Z" fill="url(#potGrad)" />
    <!-- Pot Rim -->
    <rect x="-62" y="-4" width="124" height="12" rx="4" fill="#C96841" />
    <line x1="-58" y1="4" x2="58" y2="4" stroke="#9E4624" stroke-width="1.5" />
  </g>

  <!-- Plantify Brand & Placeholder Label -->
  <g transform="translate(200, 345)" text-anchor="middle">
    <rect x="-110" y="-18" width="220" height="28" rx="14" fill="#16302B" opacity="0.9" />
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">
      🌿 Botanical Specimen
    </text>
  </g>
</svg>
